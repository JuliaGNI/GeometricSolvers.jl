# Metal tests, in their own workflow rather than as a second job in CI.yml.
#
# CI.yml is byte-identical in every repository under Packages/ and Experiments/ -- that is what
# makes the required-status-check list static and keeps branch protection from silently going stale.
# A repository that needs an extra job therefore gets an extra file, never a local edit to CI.yml.
# See ~/Research/Environment/Harness/githooks/install-workflows.sh.
#
# WHAT THIS ADDS TO CI.yml.
#
# CI.yml's macOS jobs do not run the `metal` group: each CI.yml job runs one group of
# `test/ci-groups.toml` alone, and `metal` is not one of them. This workflow is the only CI runner
# of the group. The files of the group record a skip and pass if the device is not functional or
# is virtualized (issue #34). This job runs the group alone
# (`test_args: metal`), on macOS 15 rather than on whatever `macos-latest` points to, and a step
# before the tests fails it if Metal is not functional.
#
# The runner's GPU is Apple's paravirtual device. Metal.jl supports it from 1.10 and on macOS 15 or
# later only; on `macos-14` Metal is not functional. On the paravirtual device the device tests
# throw device exceptions at random (issue #34), so the files of the `metal` group record a skip
# there and run no device test. Until issue #34 closes, this job checks only that Metal is
# functional on the runner and that the device test files load; the device tests run on a real
# Apple GPU, by hand.
#
# The jobs of this workflow are required status checks: `test/ci-groups.toml` names this file in
# its `workflows` key, so a failing job here blocks a merge.

name: Metal

on:
    push:
        branches:
            - main
        tags: ["*"]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    metal:
        name: Metal - Julia ${{ matrix.version }} - ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        permissions:
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "min"
                    - "1"
                os:
                    - macos-15
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-buildpkg@v1
            # The test environment is not instantiated here, so the check adds Metal, at the bound
            # of Project.toml, where Metal is a weak dependency, to a temporary environment.
            - name: Check that Metal is functional
              shell: julia --color=yes {0}
              run: |
                  import Pkg, TOML
                  bound = TOML.parsefile("Project.toml")["compat"]["Metal"]
                  Pkg.activate(; temp = true)
                  Pkg.add(Pkg.PackageSpec(name = "Metal", version = Pkg.Types.semver_spec(bound)))
                  using Metal
                  Metal.functional() || error("Metal is not functional on this runner, so the metal group would only skip")
                  println("Metal device: ", Metal.device())
            - uses: julia-actions/julia-runtest@v1
              with:
                  test_args: metal
                  check_bounds: auto
